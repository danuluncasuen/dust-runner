<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05080F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dust Runner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Dust Runner</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05080f;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        /* Edge to edge, under the notch and home bar. The HUD keeps clear of them itself. */
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      /* Never seen: the renderer reads the safe-area insets from its padding. */
      #safe {
        position: fixed;
        top: 0;
        left: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="safe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
