<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05080F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dust Runner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Dust Runner</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05080f;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        /* Landscape: the notch sits on a side, so keep the game inside every inset.
           svh is the smallest viewport: it stays put when Safari toolbars show or hide. */
        margin-left: env(safe-area-inset-left);
        margin-top: env(safe-area-inset-top);
        width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        height: calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        touch-action: none;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
